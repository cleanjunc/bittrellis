schema: bittrellis/manifest@2
track: HPC-01
name: gdn-fp8-state-blockfit
description: >
  FP8 on the recurrent state projections qkv and z in layers 1-63 (the map of gdn-state-fp8-skip0, #11), with
  every projection that stays NVFP4 re-encoded by nvfp4_blockfit: all MLP and attention layers, every recurrent
  out projection and the whole of recurrent layer 0. The two changes fix different errors. FP8 on qkv and z keeps
  the recurrent state and retrieval close to BF16, and nvfp4_blockfit picks each NVFP4 block scale by
  reconstruction error instead of round-to-nearest, which cuts the weight error of the NVFP4 layers to about
  0.73x with the same format and kernels. lm_head is stored BF16, so its batch-1 Q4_K is fitted once from the
  original weights. Layer 0 and attention layer 3 stay NVFP4, so the fast prefill paths stay on. Speed and
  memory should match #11; drift should fall in every section, because the gain is a better weight fit, not a
  fit to any text.
authors: [cleanjunc]
default: NVFP4
rules:
  - match: "L*.mlp"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.attn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.qkv"
    layers: "1-63"
    format: FP8
  - match: "L*.gdn.z"
    layers: "1-63"
    format: FP8
modules:
  lm_head: Q4_K
