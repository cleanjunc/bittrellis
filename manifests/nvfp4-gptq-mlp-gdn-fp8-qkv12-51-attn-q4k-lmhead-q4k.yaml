schema: bittrellis/manifest@2
track: HPC-01
name: nvfp4-gptq-mlp-gdn-fp8-qkv12-51-attn-q4k-lmhead-q4k
description: >
  #95 (FP8 recurrent qkv on layers 12-51, attention on runtime Q4_K, nvfp4_blockfit on every other NVFP4
  projection, lm_head fitted once: RP-KL 0.0796, decode 90.8, peak 22.38 GiB) with every MLP block encoded by
  nvfp4_gptq: gate and up are rounded by GPTQ on the pinned hpc01-e6 calibration statistics, down keeps the
  blockfit MLP fit. Formats and kernels are #95's, so decode, prefill and memory should not move. On the
  merged maps nvfp4_gptq lowered drift by 0.0055-0.0104 at unchanged speed (#93 to #102, #86 to #104, #74 to
  #105, #91 to #106, #32 to #107). With the shallow and deepest qkv kept on blockfit, this is the faster,
  lighter neighbour of #102 (0.0688, decode 88.7, 22.68 GiB) that no gptq result covers.
authors: [cleanjunc]
default: NVFP4
rules:
  - match: "L*.mlp"
    format: NVFP4
    quantizer: nvfp4_gptq
  - match: "L*.attn.*"
    format: Q4_K
  - match: "L*.gdn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.qkv"
    layers: "12-51"
    format: FP8
modules:
  lm_head: Q4_K
