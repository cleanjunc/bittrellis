schema: bittrellis/manifest@2
track: HPC-01
name: gdn-fp8-qkv-all-zo-split
description: >
  FP8 on the recurrent state-writing projection at every depth, and on z in the shallow half; Q4_K on z
  and out in the deep half. Measured by section under hpc01-e4: FP8 on the deep qkv is what lowers math,
  multilingual and general drift (Q4_K there costs tools and general), FP8 on the shallow qkv and z keeps
  tools and code near V0 where shallow Q4_K costs them, and Q4_K on the deep z and out claws back memory
  without touching retrieval. Layer 0, attention and the MLP stay NVFP4: attention Q4_K with layer 3 native
  drops the 32K needles, and MLP Q4_K costs about a third of prefill. 70 FP8 units instead of #11's 94
  cut the decode cost from 10% to 8%.
authors: [cleanjunc]
default: NVFP4
rules:
  - match: "L*.gdn.qkv"
    layers: "1-63"
    format: FP8
  - match: "L*.gdn.z"
    layers: "1-31"
    format: FP8
  - match: "L*.gdn.z"
    layers: "32-63"
    format: Q4_K
  - match: "L*.gdn.out"
    layers: "32-63"
    format: Q4_K
