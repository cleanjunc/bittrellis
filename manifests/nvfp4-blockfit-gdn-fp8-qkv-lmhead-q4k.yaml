schema: bittrellis/manifest@2
track: HPC-01
name: nvfp4-blockfit-gdn-fp8-qkv-lmhead-q4k
description: >
  FP8 on the recurrent qkv projection of layers 1-63 only, with nvfp4_blockfit bytes on every other NVFP4
  projection and lm_head fitted once as Q4_K. qkv carries most of what FP8 buys on the recurrent path: measured
  by section against blockfit alone, it takes long-context drift from 0.75 to 0.30 and maths from 0.41 to 0.25,
  and lowers code, general, multilingual and tools too. Leaving z and out on blockfit keeps half the FP8 bytes of
  gdn-fp8-state-blockfit, so decode and memory sit between that recipe and blockfit alone. Layer 0 keeps its
  NVFP4 bytes, which select the batched-prefill path.
authors: [cleanjunc]
default: NVFP4
rules:
  - match: "L*.mlp"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.attn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.qkv"
    layers: "1-63"
    format: FP8
modules:
  lm_head: Q4_K
