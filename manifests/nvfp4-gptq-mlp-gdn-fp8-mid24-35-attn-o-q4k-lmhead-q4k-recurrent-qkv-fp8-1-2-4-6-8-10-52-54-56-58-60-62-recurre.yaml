schema: bittrellis/manifest@2
track: HPC-01
name: nvfp4-gptq-mlp-gdn-fp8-mid24-35-attn-o-q4k-lmhead-q4k-recurrent-qkv-fp8-1-2-4-6-8-10-52-54-56-58-60-62-recurre
description: '#118 with runtime Q4_K on the attention of every layer and runtime Q4_K on the recurrent qkv of layers
  1-10,24-30; every other unit keeps #118''s assignment. The substitution was measured by the evaluator on other
  maps (see the PR description).'
authors:
- cleanjunc
default: NVFP4
rules:
- match: L*.mlp
  format: NVFP4
  quantizer: nvfp4_gptq
- match: L*.attn.q
  format: Q4_K
- match: L*.attn.k
  format: Q4_K
- match: L*.attn.v
  format: Q4_K
- match: L*.attn.o
  format: Q4_K
- match: L*.gdn.qkv
  format: NVFP4
  quantizer: nvfp4_blockfit
- match: L*.gdn.qkv
  layers: 32-34,52-54,56-58,60-62
  format: FP8
- match: L*.gdn.qkv
  layers: 1-2,4-6,8-10,24-26,28-30
  format: Q4_K
- match: L*.gdn.z
  format: NVFP4
  quantizer: nvfp4_blockfit
- match: L*.gdn.out
  format: NVFP4
  quantizer: nvfp4_blockfit
- match: L*.gdn.out
  layers: 24-26,28-30,32-34
  format: FP8
modules:
  lm_head: Q4_K
