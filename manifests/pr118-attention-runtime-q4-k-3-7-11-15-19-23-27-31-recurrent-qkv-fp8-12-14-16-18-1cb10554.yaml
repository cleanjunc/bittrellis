schema: bittrellis/manifest@2
track: HPC-01
name: pr118-attention-runtime-q4-k-3-7-11-15-19-23-27-31-recurrent-qkv-fp8-12-14-16-18-1cb10554
description: '#118 with runtime Q4_K on the attention of layers 3-31 and FP8 on the recurrent qkv of layers 12-22,36-50;
  every other unit keeps #118''s assignment. The substitution was measured by the evaluator on other maps (see the
  PR description).'
authors:
- cleanjunc
default: NVFP4
rules:
- match: L*.mlp
  format: NVFP4
  quantizer: nvfp4_gptq
- match: L*.attn.q
  format: Q4_K
- match: L*.attn.q
  layers: 35,39,43,47,51,55,59,63
  format: NVFP4
  quantizer: nvfp4_blockfit
- match: L*.attn.k
  format: Q4_K
- match: L*.attn.k
  layers: 35,39,43,47,51,55,59,63
  format: NVFP4
  quantizer: nvfp4_blockfit
- match: L*.attn.v
  format: Q4_K
- match: L*.attn.v
  layers: 35,39,43,47,51,55,59,63
  format: NVFP4
  quantizer: nvfp4_blockfit
- match: L*.attn.o
  format: Q4_K
- match: L*.gdn.qkv
  format: FP8
- match: L*.gdn.qkv
  layers: '0'
  format: NVFP4
  quantizer: nvfp4_blockfit
- match: L*.gdn.z
  format: NVFP4
  quantizer: nvfp4_blockfit
- match: L*.gdn.out
  format: NVFP4
  quantizer: nvfp4_blockfit
- match: L*.gdn.out
  layers: 24-26,28-30,32-34
  format: FP8
modules:
  lm_head: Q4_K
