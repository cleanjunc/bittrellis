schema: bittrellis/manifest@2
track: HPC-02
name: ud-downs-q4k-gdn-qkv-q4k-lmhead-embed-q4k
description: >
  #126 (unsloth UD-Q4_K_M with routed expert downs, lm_head and token embeddings on Q4_K: RP-KL 0.0493, decode
  403.1, 23.96 GiB) with the recurrent qkv projections of the 30 Gated DeltaNet layers on Q4_K (kq_rtn) instead
  of unsloth's Q8_0. They are the largest dense tensors a decoded token reads in full (0.50 B weights), and Q4_K
  is the format SparkInfer reads fastest, so decode rises by about 7% with 0.23 GiB less memory; attention,
  the recurrent z/out and the shared experts stay Q8_0. Measured on an RTX 5090 against #126 built the same way:
  RP-KL +0.012, decode 403.4 -> 431.3, peak 23.96 -> 23.73 GiB.
default: Q8_0
encoders: {Q4_K: unsloth_ud, Q5_K: unsloth_ud, Q6_K: unsloth_ud, Q8_0: unsloth_ud}
rules:
  - match: "L*.exps.gate"
    format: Q4_K
  - match: "L*.exps.up"
    format: Q4_K
  - match: "L*.exps.down"
    format: Q4_K
    encoder: kq_rtn
  - match: "L*.gdn.qkv"
    format: Q4_K
    encoder: kq_rtn
modules:
  L34.exps.down: Q6_K
  L38.exps.down: Q6_K
  L39.exps.down: Q6_K
  lm_head: {format: Q4_K, encoder: kq_rtn}
  embed: {format: Q4_K, encoder: kq_rtn}
