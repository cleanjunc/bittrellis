schema: bittrellis/manifest@2
track: HPC-02
name: pr129-attention-q4k
description: >
  #129's map (the #126 map with the recurrent qkv on Q4_K) with the q, k, v and o projections of the 10 full-attention layers on Q4_K (kq_rtn) as well. They are read in full for every decoded token (0.27 B weights), so decode should rise by a few percent over #129 with 0.12 GiB less memory.
default: Q8_0
encoders: {Q4_K: unsloth_ud, Q5_K: unsloth_ud, Q6_K: unsloth_ud, Q8_0: unsloth_ud}
rules:
  - match: "L*.exps.gate"
    format: Q4_K
  - match: "L*.exps.up"
    format: Q4_K
  - match: "L*.exps.down"
    format: Q4_K
    encoder: kq_rtn
  - match: "L*.gdn.qkv"
    format: Q4_K
    encoder: kq_rtn
  - match: "L*.attn.*"
    format: Q4_K
    encoder: kq_rtn
modules:
  L34.exps.down: Q6_K
  L38.exps.down: Q6_K
  L39.exps.down: Q6_K
  lm_head: {format: Q4_K, encoder: kq_rtn}
  embed: {format: Q4_K, encoder: kq_rtn}
