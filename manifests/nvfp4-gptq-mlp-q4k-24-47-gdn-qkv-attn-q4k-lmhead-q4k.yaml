schema: bittrellis/manifest@2
track: HPC-01
name: nvfp4-gptq-mlp-q4k-24-47-gdn-qkv-attn-q4k-lmhead-q4k
description: >
  #104 (Q4_K recurrent qkv 1-63 and attention, nvfp4_gptq on every MLP block, nvfp4_blockfit on the recurrent
  z and out, lm_head fitted once: RP-KL 0.0754, decode 94.4, prefill 13,725, 21.67 GiB) with Q4_K on the 24
  MLP layers 24-47. The same window over #86's blockfit map measured 0.0897 drift, decode -0.5%, prefill
  -32% and -0.77 GiB against V0; here the 40 NVFP4 MLP layers outside the window keep their gptq bytes, which
  lowered drift by about 0.010 when applied to all 64 (#86 to #104). Expected: about 0.083-0.086 drift at
  decode 94.5, prefill near 11,300 and 21.25 GiB, a point between #104 and the low-memory Q4_K maps
  (#87 at 20.56 GiB, gdn-q4k-fp8-mid24-35-mlp-q4k at 20.98) that no gptq result covers.
authors: [cleanjunc]
default: NVFP4
rules:
  - match: "L*.mlp"
    format: NVFP4
    quantizer: nvfp4_gptq
  - match: "L*.attn.*"
    format: Q4_K
  - match: "L*.gdn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.qkv"
    layers: "1-63"
    format: Q4_K
  - match: "L*.mlp"
    layers: "24-47"
    format: Q4_K
modules:
  lm_head: Q4_K
