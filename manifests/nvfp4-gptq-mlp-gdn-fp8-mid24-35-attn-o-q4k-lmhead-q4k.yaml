schema: bittrellis/manifest@2
track: HPC-01
name: nvfp4-gptq-mlp-gdn-fp8-mid24-35-attn-o-q4k-lmhead-q4k
description: >
  #105 (FP8 on every recurrent projection of layers 24-35, nvfp4_gptq on the MLP, nvfp4_blockfit on every other
  NVFP4 projection, lm_head fitted once: RP-KL 0.0798, decode 92.5, prefill 16,059, 22.39 GiB) with runtime Q4_K
  on the attention output projection only. The o projection has its own prefill path, so q, k and v keep the fast
  NVFP4 prefill: the same change over #63's band map was measured at RP-KL -0.0046, prefill -3.4%, decode -0.2%
  and -0.04 GiB. Q4_K on all attention gains more drift the cleaner the MLP is (V0 to V5 -0.0075, #28 to #91
  -0.0083, #108 to #106 -0.0099), so on gptq bytes o alone should give about 0.005-0.006: a point between #105
  and #106 that keeps most of #105's prefill.
authors: [cleanjunc]
default: NVFP4
rules:
  - match: "L*.mlp"
    format: NVFP4
    quantizer: nvfp4_gptq
  - match: "L*.attn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.*"
    layers: "24-35"
    format: FP8
  - match: "L*.attn.o"
    format: Q4_K
modules:
  lm_head: Q4_K
