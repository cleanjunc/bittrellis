schema: bittrellis/manifest@2
track: HPC-01
name: pr117-attention-q4k-1720c18e6338aca2
description: >
  #117 (nvfp4_gptq MLP, FP8 recurrent qkv outside layers 0, 12-22 and 36-50, FP8 recurrent out on 24-35,
  nvfp4_blockfit z, Q4_K attention output, lm_head fitted once: RP-KL 0.0711, decode 90.7, prefill 14,902,
  22.55 GiB) with runtime Q4_K on the attention q, k and v projections as well, so all of attention is Q4_K.
  On FP8-recurrent maps the evaluator measured Q4_K attention at RP-KL -0.0012 to -0.0039 (#109 to #102,
  #80 to #93) and -0.0099 on the all-NVFP4 gptq map (#108 to #106); weighted by how alike those maps are to #117,
  about -0.004 here, with about -3% prefill and -0.13 GiB: a point between #117 and #102 (0.0688, 88.7, 22.68 GiB).
authors: [cleanjunc]
default: NVFP4
rules:
  - match: "L*.mlp"
    format: NVFP4
    quantizer: nvfp4_gptq
  - match: "L*.attn.*"
    format: Q4_K
  - match: "L*.gdn.qkv"
    format: FP8
  - match: "L*.gdn.qkv"
    layers: "0,12-22,36-50"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.z"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.out"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.out"
    layers: "24-35"
    format: FP8
modules:
  lm_head: Q4_K
